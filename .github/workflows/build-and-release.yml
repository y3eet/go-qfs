name: Build and Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        include:
          - os: ubuntu-latest
            artifact_name: go-qfs-linux
          - os: windows-latest
            artifact_name: go-qfs-windows.exe
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "latest"

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt update
          sudo apt install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install frontend deps
        run: |
          cd frontend
          bun install

      - name: Build
        run: wails build -tags webkit2_41

      - name: Debug build output
        shell: bash
        run: ls -la build/bin/

      - name: Rename binary
        shell: bash
        run: |
          mkdir -p dist
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp build/bin/qfs.exe dist/${{ matrix.artifact_name }}
          else
            chmod +x build/bin/qfs
            cp build/bin/qfs dist/${{ matrix.artifact_name }}
            tar -czf dist/${{ matrix.artifact_name }}.tar.gz -C build/bin qfs
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need full history to find the previous tag

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            LOG=$(git log --no-merges --pretty=format:"- %s (%h)")
          else
            LOG=$(git log ${PREV_TAG}..HEAD --no-merges --pretty=format:"- %s (%h)")
          fi
          echo "log<<EOF" >> $GITHUB_OUTPUT
          echo "$LOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: go-qfs ${{ github.ref_name }}
          body: |
            ## Changes
            ${{ steps.changelog.outputs.log }}
          files: dist/**/*
